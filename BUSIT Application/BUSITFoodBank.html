    <main>
        <h2>Food Bank </h2>
        <h2>Food Bank Assistance</h2>
            <p>Find nearby food banks on the map below:</p>
                <div id="map" style="height: 500px; width: 100%; margin-top: 20px;"></div>

                <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

                <script>
                    // Sample food bank data (latitude, longitude, name)
                    const foodBanks = [
                        { name: "City Center Food Bank", lat: -26.2041, lng: 28.0473 },
                        { name: "Hope Kitchen", lat: -26.2100, lng: 28.0500 },
                        { name: "Community Pantry", lat: -26.2000, lng: 28.0600 }
                    ];
                
                    // Initialize the map
                    const map = L.map('map').setView([-26.2041, 28.0473], 13); // Example: Johannesburg
                
                    // Load OpenStreetMap tiles
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);
                
                    // Add markers for each food bank
                    foodBanks.forEach(bank => {
                        L.marker([bank.lat, bank.lng])
                            .addTo(map)
                            .bindPopup(`<strong>${bank.name}</strong>`);
                    });
                </script>

    </main>

</body>
